# Alembic 配置。数据库 URL 不在这里配：migrations/env.py 复用应用自己的
# settings（server.db.session.get_engine），密钥不落进这个文件。

[alembic]
script_location = migrations
# src 布局：让 env.py 不装包也能 import server（uv run 本来就装）。
prepend_sys_path = src
# 版本文件名：<rev>_<slug>.py（如 0001_login_token_expires_at_index.py）。
file_template = %%(rev)s_%%(slug)s
version_path_separator = os
truncate_slug_length = 40

# 留空：URL 由 migrations/env.py 从应用 settings 里拿。
sqlalchemy.url =

[post_write_hooks]

# 下面是 alembic 模板的标准日志配置。
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
