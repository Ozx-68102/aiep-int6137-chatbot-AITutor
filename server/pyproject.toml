[project]
name = "server"
version = "0.1.0"
description = "Backend for Frontend (H^2 Bot)"
authors = [
    { name = "Ozx-68102", email = "ozx1072960726@gmail.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "ruff>=0.17.2",
]

[project.scripts]
server = "server:main"

[tool.ruff]
target-version = "py313"
exclude = [
    ".agents",
    ".cursor",
    ".venv"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "TID", # flake8-tidy-imports (TID251)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Use native Python 3.13 typing; do not import annotations from __future__."
