[project]
name = "server"
version = "0.1.0"
description = "Backend for Frontend (H^2 Bot)"
authors = [
    { name = "Ozx-68102", email = "ozx1072960726@gmail.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "furl>=2.1.4",
    "httpx2>=2.16.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "ruff>=0.17.2",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
server = "server:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
exclude = [
    ".agents",
    ".cursor",
    ".venv"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "TID", # flake8-tidy-imports (TID251)
    "RET",  # flake8-return
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Use native Python 3.13 typing; do not import annotations from __future__."

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
